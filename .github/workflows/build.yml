name: Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      push-to-ghcr:
        description: 'Push build to GHCR if not on main.'
        type: boolean
        default: false
        required: false
  workflow_call:
    inputs:
      release:
        description: 'Tag the image with the release-please manifest version instead of dev.'
        type: boolean
        default: false
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "${{ github.repository }}"

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get image tag
        id: version
        env:
          RELEASE: ${{ inputs.release == true }}
          # Package path as release-please writes it in the manifest.
          PACKAGE: "."
        run: |
          if [[ "${RELEASE}" != "true" ]]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(jq -r --arg pkg "${PACKAGE}" '.[$pkg] // ""' .release-please-manifest.json)
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '${VERSION}' for ${PACKAGE} in .release-please-manifest.json"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Image
        id: build-image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker build -t "${IMAGE}" .
      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: cyclonedx-json
          artifact-name: weather_sbom.json
      - name: Scan Image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          fail-build: ${{ inputs.release != true }}
          severity-cutoff: high
          output-format: cyclonedx-json
          output-file: grype_results.json
      - name: Push it real good
        id: push
        if: ${{ inputs.push-to-ghcr == true || github.ref == 'refs/heads/main' }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker push "${IMAGE}"
      - name: Send to SecObserve
        if: ${{ !cancelled() && hashFiles('grype_results.json') != '' }}
        uses: SecObserve/secobserve_actions_templates/actions/upload_observations@d7e9250f6180fbad1c6b4ea712db8b2712fd4d2e # v2026_10
        with:
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_file_name: grype_results.json
          so_product_name: ${{ vars.SO_PRODUCT_NAME }}
          so_api_base_url: ${{ secrets.SO_API_BASE_URL }}
          so_branch_name: ${{ github.head_ref || github.ref_name }}
